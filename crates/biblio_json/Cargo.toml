[package]
name = "biblio_json"
version = "0.1.7"
edition = "2024"

[dependencies]
bimap = { version = "0.6.3", features = ["serde"] }
bincode = { version = "2.0.1", features = ["serde"] }
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
glob = "0.3.2"
isolang = { version = "2.4.0", features = ["local_names", "lowercase_names", "serde"] }
itertools = "0.14.0"
lazy_static = "1.5.0"
maplit = "1.0.2"
rand = "0.9.2"
rayon = "1.10.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_with = "3.14.0"
time = "^0.3"
toml = "0.9.5"
